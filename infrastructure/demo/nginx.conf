# Replace DEMO_HOST with the approved hostname. No wildcard proxy to Keycloak.
# Install only after validating the certificate and nginx -t.
server {
    listen 80;
    server_name DEMO_HOST;
    location /.well-known/acme-challenge/ { root /var/www/pmqms-demo-acme; }
    location / { return 301 https://DEMO_HOST$request_uri; }
}

server {
    listen 443 ssl;
    server_name DEMO_HOST;
    ssl_certificate /etc/letsencrypt/live/DEMO_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DEMO_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;
    proxy_read_timeout 120s;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # Application authentication uses its existing Secure session cookies.
    # Never expose HTTP basic credentials to the upstream applications.
    proxy_set_header Authorization "";

    location /realms/perfect-match/ { proxy_pass http://127.0.0.1:18080; }
    location /resources/ { proxy_pass http://127.0.0.1:18080; }
    location /admin { return 404; }
    location /realms/ { return 404; }
    location /auth/callback { proxy_pass http://127.0.0.1:18000; }
    # Use the application's normal same-origin proxy and its allowlist.
    location / { proxy_pass http://127.0.0.1:13000; }
}
