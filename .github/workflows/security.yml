name: Foundation security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.10"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && uv sync --frozen
      - run: mkdir -p artifacts
      - name: Install verified security scanners
        run: ./scripts/install-ci-security-tools.sh
      - name: OpenGrep rule fixtures
        run: ./security/opengrep/test-rules.sh
      - name: OpenGrep SAST
        run: opengrep scan --sarif --config security/opengrep/rules.yml --exclude security/tests/fixtures --output artifacts/opengrep.sarif .
      - name: Trivy filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          cache-dir: ${{ runner.temp }}/trivy-cache
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          output: artifacts/trivy.sarif
      - name: Gitleaks worktree and history
        run: |
          gitleaks dir --config .gitleaks.toml --redact --no-banner .
          gitleaks git --config .gitleaks.toml --redact --no-banner .
      - name: Dependency audits
        run: |
          cd apps/api && uvx --from pip-audit==2.10.1 pip-audit -r requirements-runtime.txt
          cd ../.. && pnpm audit --audit-level high
      - name: License validation
        run: ./scripts/check-licenses.sh
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-security-sarif
          path: artifacts/*.sarif
