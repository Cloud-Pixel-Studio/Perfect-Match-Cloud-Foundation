name: Foundation security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    env:
      TRIVY_CACHE_DIR: /tmp/trivy-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.10"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && uv sync --frozen
      - run: mkdir -p artifacts
      - name: Install verified security scanners
        run: ./scripts/install-ci-security-tools.sh
      - name: OpenGrep rule fixtures
        run: ./security/opengrep/test-rules.sh
      - name: OpenGrep SAST
        run: opengrep scan --sarif --config security/opengrep/rules.yml --exclude security/tests/fixtures --output artifacts/opengrep.sarif .
      - name: Trivy filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          cache-dir: /tmp/trivy-cache
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          output: artifacts/trivy.sarif
      - name: Gitleaks worktree and history
        run: |
          gitleaks dir --config .gitleaks.toml --redact --no-banner .
          gitleaks git --config .gitleaks.toml --redact --no-banner .
      - name: Dependency audits
        run: |
          cd apps/api && uvx --from pip-audit==2.10.1 pip-audit -r requirements-runtime.txt
          cd ../.. && pnpm audit --audit-level high
      - name: License validation
        run: |
          ./scripts/test-license-validator.sh
          ./scripts/check-licenses.sh
      - name: Build commit-bound application images
        env:
          IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker build --pull=false --tag "pmcloud-api:${IMAGE_TAG}" apps/api
          docker build --pull=false --tag "pmcloud-web:${IMAGE_TAG}" --target runtime --file apps/web/Dockerfile .
          docker tag "pmcloud-api:${IMAGE_TAG}" pmcloud-api:latest
          docker tag "pmcloud-api:${IMAGE_TAG}" pmcloud-database-bootstrap:latest
          docker tag "pmcloud-api:${IMAGE_TAG}" pmcloud-migrate:latest
          docker tag "pmcloud-api:${IMAGE_TAG}" pmcloud-identity-bootstrap:latest
          docker tag "pmcloud-web:${IMAGE_TAG}" pmcloud-web:latest
          docker image inspect "pmcloud-api:${IMAGE_TAG}" "pmcloud-web:${IMAGE_TAG}" > artifacts/application-images.json
      - name: Build hardened PostgreSQL image
        run: ./scripts/build-test-postgres.sh
      - name: Prepare disposable CI runtime
        id: runtime
        continue-on-error: true
        run: |
          ./scripts/prepare-local.sh "${RUNNER_TEMP}/pmcloud/dev.env"
          set -a
          source "${RUNNER_TEMP}/pmcloud/dev.env"
          set +a
          chmod 644 "${PMC_RUNTIME_DIR}/seaweedfs-s3.json"

          wait_for_url() {
            local label=$1
            local url=$2
            for attempt in $(seq 1 120); do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                printf '%s is ready after %s attempt(s).\n' "$label" "$attempt"
                return 0
              fi
              sleep 3
            done
            printf '::error::%s did not become ready at %s\n' "$label" "$url"
            curl --silent --show-error "$url" | head -c 4096 || true
            printf '\n'
            return 1
          }

          # Start the API dependency chain first. Starting every service in one
          # command makes Compose block on the API health condition and hides
          # the readiness response that explains the failure.
          docker compose --env-file "${RUNNER_TEMP}/pmcloud/dev.env" up -d --no-build api
          wait_for_url "API readiness" http://127.0.0.1:8000/health
          docker compose --env-file "${RUNNER_TEMP}/pmcloud/dev.env" up -d --no-build web
          wait_for_url "Web readiness" http://127.0.0.1:3000
          docker compose --env-file "${RUNNER_TEMP}/pmcloud/dev.env" ps
      - name: Dump disposable runtime diagnostics
        if: steps.runtime.outcome == 'failure'
        run: |
          docker compose --env-file "${RUNNER_TEMP}/pmcloud/dev.env" ps --all || true
          docker inspect --format '{{json .State.Health}}' pmcloud-api-1 || true
          curl --silent --show-error http://127.0.0.1:8000/health || true
          printf '\n'
          docker compose --env-file "${RUNNER_TEMP}/pmcloud/dev.env" logs --no-color \
            postgres database-bootstrap migrate keycloak identity-bootstrap seaweedfs \
            clamav-database-bootstrap clamav api web || true
      - name: Install visual QA browser
        if: steps.runtime.outcome == 'success'
        run: pnpm --filter @perfect-match/web exec playwright install --with-deps chromium
      - name: Responsive visual and accessibility regression
        if: steps.runtime.outcome == 'success'
        run: ./scripts/run-web-visual-qa.sh "${RUNNER_TEMP}/pmcloud/dev.env"
      - name: Reclaim ephemeral build cache for security analysis
        if: always()
        run: |
          docker builder prune --all --force
          docker system df
          df -h /
      - name: Final application image scans
        if: always()
        env:
          IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          trivy image --format json --scanners vuln,secret --output artifacts/trivy-api-image.json "pmcloud-api:${IMAGE_TAG}"
          trivy image --format json --scanners vuln,secret --output artifacts/trivy-web-image.json "pmcloud-web:${IMAGE_TAG}"
          jq -n \
            --argjson api "$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' artifacts/trivy-api-image.json)" \
            --argjson web "$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' artifacts/trivy-web-image.json)" \
            '{api: $api, web: $web}' > artifacts/application-image-gate.json
      - name: Third-party image scans
        if: always()
        id: third-party-images
        run: |
          trivy image --format json --scanners vuln --output artifacts/trivy-postgres-image.json pmcloud-postgres:local
          trivy image --format json --scanners vuln --output artifacts/trivy-seaweedfs-image.json chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
          trivy image --format json --scanners vuln --output artifacts/trivy-keycloak-image.json quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
          trivy image --format json --scanners vuln --output artifacts/trivy-clamav-image.json clamav/clamav:1.5.4@sha256:bda39705e291105049c3936e2803ac90b955172af8030f94f05dce1252df6c6d
          for report in artifacts/trivy-postgres-image.json artifacts/trivy-seaweedfs-image.json artifacts/trivy-keycloak-image.json artifacts/trivy-clamav-image.json; do
            jq -e '.Results | type == "array"' "$report" >/dev/null
          done
          jq -n \
            --argjson postgres "$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' artifacts/trivy-postgres-image.json)" \
            --argjson seaweedfs "$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' artifacts/trivy-seaweedfs-image.json)" \
            --argjson keycloak "$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' artifacts/trivy-keycloak-image.json)" \
            --argjson clamav "$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' artifacts/trivy-clamav-image.json)" \
            '{postgres: $postgres, seaweedfs: $seaweedfs, keycloak: $keycloak, clamav: $clamav}' \
            > artifacts/third-party-image-gate.json
      - name: Generate and validate CycloneDX SBOMs
        if: always()
        env:
          IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          trivy fs --format cyclonedx --output artifacts/sbom-repository.json .
          trivy image --format cyclonedx --output artifacts/sbom-api.json "pmcloud-api:${IMAGE_TAG}"
          trivy image --format cyclonedx --output artifacts/sbom-web.json "pmcloud-web:${IMAGE_TAG}"
          trivy image --format cyclonedx --output artifacts/sbom-keycloak.json quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
          trivy image --format cyclonedx --output artifacts/sbom-clamav.json clamav/clamav:1.5.4@sha256:bda39705e291105049c3936e2803ac90b955172af8030f94f05dce1252df6c6d
          for sbom in artifacts/sbom-*.json; do
            jq -e '.bomFormat == "CycloneDX" and (.metadata | type == "object") and (.components | length > 0)' "$sbom" >/dev/null
          done
      - name: OWASP ZAP passive baseline
        if: always() && steps.runtime.outcome == 'success'
        run: |
          chmod -R a+rwX artifacts
          docker run --rm --network host \
            --volume "${PWD}/artifacts:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-baseline.py -t http://127.0.0.1:3000 -r zap.html -J zap.json -I 2>&1 | tee artifacts/zap.log
          python3 scripts/summarize-zap.py artifacts/zap.json artifacts/zap.log artifacts/zap-summary.json
      - name: Write release evidence manifest
        if: always()
        env:
          IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        run: |
          component_count() {
            if test -f "$1"; then jq '.components | length' "$1"; else printf '%s\n' -1; fi
          }
          SBOM_COUNT=$(find artifacts -maxdepth 1 -name 'sbom-*.json' | wc -l | tr -d ' ')
          SBOM_REPOSITORY=$(component_count artifacts/sbom-repository.json)
          SBOM_API=$(component_count artifacts/sbom-api.json)
          SBOM_WEB=$(component_count artifacts/sbom-web.json)
          SBOM_KEYCLOAK=$(component_count artifacts/sbom-keycloak.json)
          SBOM_CLAMAV=$(component_count artifacts/sbom-clamav.json)
          jq -n \
            --arg sha "$IMAGE_TAG" \
            --arg run "$RUN_ID" \
            --arg runtime "$RUNTIME_OUTCOME" \
            --argjson images "$(cat artifacts/application-images.json 2>/dev/null || echo '[]')" \
            --argjson zap "$(cat artifacts/zap-summary.json 2>/dev/null || echo '{}')" \
            --argjson licenses "$(cat artifacts/licenses/summary.json 2>/dev/null || echo '{}')" \
            --argjson application_image_findings "$(cat artifacts/application-image-gate.json 2>/dev/null || echo '{}')" \
            --argjson third_party_images "$(cat artifacts/third-party-image-gate.json 2>/dev/null || echo '{}')" \
            --argjson sboms "$SBOM_COUNT" \
            --argjson repository_components "$SBOM_REPOSITORY" \
            --argjson api_components "$SBOM_API" \
            --argjson web_components "$SBOM_WEB" \
            --argjson keycloak_components "$SBOM_KEYCLOAK" \
            --argjson clamav_components "$SBOM_CLAMAV" \
            '{github_sha: $sha, workflow_run_id: $run, runtime_outcome: $runtime, application_images: $images, zap: $zap, licenses: $licenses, application_image_high_or_critical: $application_image_findings, third_party_image_high_or_critical: $third_party_images, sboms: {count: $sboms, repository_components: $repository_components, api_components: $api_components, web_components: $web_components, keycloak_components: $keycloak_components, clamav_components: $clamav_components}}' \
            /dev/null > artifacts/release-evidence-manifest.json
      - name: Enforce final release gates
        if: always()
        env:
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        run: |
          test "$RUNTIME_OUTCOME" = success
          test -f artifacts/release-evidence-manifest.json
          jq -e 'to_entries | all(.value == 0)' artifacts/application-image-gate.json >/dev/null
          jq -e 'to_entries | all(.value == 0)' artifacts/third-party-image-gate.json >/dev/null
          jq -e '.sboms.count == 5 and ([.sboms.repository_components,.sboms.api_components,.sboms.web_components,.sboms.keycloak_components,.sboms.clamav_components] | all(. > 0))' artifacts/release-evidence-manifest.json >/dev/null
      - name: Stop disposable CI runtime
        if: always()
        run: |
          docker compose --env-file "${RUNNER_TEMP}/pmcloud/dev.env" down --volumes --remove-orphans || true
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-security-sarif
          path: artifacts/*.sarif
      - name: Upload final release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-security-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts
