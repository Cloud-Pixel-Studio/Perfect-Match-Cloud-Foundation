rules:
  - id: pmc.python.wildcard-cors
    languages: [python]
    severity: ERROR
    message: Wildcard CORS is prohibited for Perfect Match Cloud services.
    metadata:
      category: security
      confidence: high
      technology: [fastapi]
    pattern: $APP.add_middleware(..., allow_origins=["*"], ...)
  - id: pmc.python.literal-insecure-cookie
    languages: [python]
    severity: ERROR
    message: Cookie security must be controlled by validated environment configuration.
    metadata:
      category: security
      confidence: high
      technology: [fastapi]
    pattern: $RESPONSE.set_cookie(..., secure=False, ...)
  - id: pmc.python.authentication-bypass-flag
    languages: [python]
    severity: ERROR
    message: Authentication and authorization bypass flags are prohibited.
    metadata:
      category: security
      confidence: high
      technology: [fastapi]
    pattern-either:
      - pattern: AUTHENTICATION_DISABLED = True
      - pattern: AUTHORIZATION_BYPASS = True
  - id: pmc.python.audit-direct-mutation
    languages: [python]
    severity: ERROR
    message: Audit events must be written only through the audit service and cannot be mutated directly.
    metadata:
      category: security
      confidence: high
    patterns:
      - pattern-either:
          - pattern: $DB.execute("...UPDATE audit_events...")
          - pattern: $DB.execute("...DELETE FROM audit_events...")
      - pattern-not-inside: |
          def record(...):
            ...
  - id: pmc.python.public-audit-write
    languages: [python]
    severity: ERROR
    message: Audit events have no public write endpoint.
    metadata:
      category: security
      confidence: high
    pattern: '@$ROUTER.post("/audit/events", ...)'
