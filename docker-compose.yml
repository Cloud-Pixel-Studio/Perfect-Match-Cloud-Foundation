name: pmcloud

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - platform

  seaweedfs:
    image: chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
    command:
      - server
      - -s3
      - -dir=/data
      - -ip=seaweedfs
      - -master.volumeSizeLimitMB=256
      - -master.telemetry=false
      - -s3.config=/etc/seaweedfs/s3.json
    environment:
      WEED_JWT_FILER_SIGNING_KEY: ${SEAWEEDFS_SIGNING_KEY}
    healthcheck:
      test: ["CMD", "nc", "-z", "-w", "2", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s
    ports:
      - "127.0.0.1:8333:8333"
    restart: unless-stopped
    volumes:
      - seaweedfs_data:/data
      - ${PMC_RUNTIME_DIR}/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - platform
      - edge

  api:
    build:
      context: ./apps/api
    environment:
      PMC_APP_VERSION: ${APP_VERSION:-0.1.0}
      PMC_DATABASE_URL: postgresql+pg8000://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PMC_S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      PMC_S3_ENDPOINT: http://seaweedfs:8333
      PMC_S3_REGION: us-east-1
      PMC_S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    networks:
      - platform
      - edge

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: ${WEB_BUILD_TARGET:-runtime}
    environment:
      API_INTERNAL_URL: http://api:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks:
      - platform
      - edge

networks:
  platform:
    internal: true
  edge:

volumes:
  postgres_data:
  seaweedfs_data:
