name: pmcloud

services:
  postgres:
    image: postgres:18-alpine@sha256:24b9bbcd16361b62a3051ed06287050fd9a61f6fb6d36f1850eae4b741c61ce3
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - platform

  database-bootstrap:
    build:
      context: ./apps/api
    command: ["python", "-m", "pmc_api.bootstrap_database"]
    environment:
      PMC_DATABASE_ADMIN_URL: postgresql+pg8000://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-pmcloud_migrator}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-pmcloud_app}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - platform

  migrate:
    build:
      context: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      PMC_DATABASE_URL: postgresql+pg8000://${POSTGRES_MIGRATION_USER:-pmcloud_migrator}:${POSTGRES_MIGRATION_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - platform

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
    command: ["start-dev", "--hostname-strict=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HTTP_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=65
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 8s
      timeout: 5s
      retries: 24
      start_period: 30s
    mem_limit: 768m
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - platform
      - edge

  identity-bootstrap:
    build:
      context: ./apps/api
    command: ["python", "-m", "pmc_api.local_identity_bootstrap"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/
      KEYCLOAK_MULTI_USER_PASSWORD: ${KEYCLOAK_MULTI_USER_PASSWORD}
      KEYCLOAK_USER_A_PASSWORD: ${KEYCLOAK_USER_A_PASSWORD}
      KEYCLOAK_USER_B_PASSWORD: ${KEYCLOAK_USER_B_PASSWORD}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-perfect-match-web}
      OIDC_ISSUER: ${OIDC_ISSUER}
      PMC_DATABASE_ADMIN_URL: postgresql+pg8000://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PMC_WEB_URL: ${PMC_WEB_URL}
    depends_on:
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - platform

  seaweedfs:
    image: chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
    command:
      - server
      - -s3
      - -dir=/data
      - -ip=seaweedfs
      - -master.volumeSizeLimitMB=256
      - -master.telemetry=false
      - -s3.config=/etc/seaweedfs/s3.json
    environment:
      WEED_JWT_FILER_SIGNING_KEY: ${SEAWEEDFS_SIGNING_KEY}
    healthcheck:
      test: ["CMD", "nc", "-z", "-w", "2", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s
    ports:
      - "127.0.0.1:8333:8333"
    restart: unless-stopped
    volumes:
      - seaweedfs_data:/data
      - ${PMC_RUNTIME_DIR}/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - platform
      - edge

  api:
    build:
      context: ./apps/api
    environment:
      PMC_APP_VERSION: ${APP_VERSION:-0.2.0}
      PMC_COOKIE_SECURE: ${PMC_COOKIE_SECURE:-false}
      PMC_DATABASE_URL: postgresql+pg8000://${POSTGRES_RUNTIME_USER:-pmcloud_app}:${POSTGRES_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PMC_ENVIRONMENT: ${PMC_ENVIRONMENT:-development}
      PMC_LOGIN_TRANSACTION_KEY: ${PMC_LOGIN_TRANSACTION_KEY}
      PMC_OIDC_BACKCHANNEL_BASE_URL: ${OIDC_BACKCHANNEL_BASE_URL}
      PMC_OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL}
      PMC_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-perfect-match-web}
      PMC_OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL}
      PMC_OIDC_ISSUER: ${OIDC_ISSUER}
      PMC_S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      PMC_S3_ENDPOINT: http://seaweedfs:8333
      PMC_S3_REGION: us-east-1
      PMC_S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
      PMC_WEB_URL: ${PMC_WEB_URL}
    depends_on:
      postgres:
        condition: service_healthy
      identity-bootstrap:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    networks:
      - platform
      - edge

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: ${WEB_BUILD_TARGET:-runtime}
    environment:
      API_INTERNAL_URL: http://api:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks:
      - platform
      - edge

networks:
  platform:
    internal: true
  edge:

volumes:
  keycloak_data:
  postgres_data:
  seaweedfs_data:
