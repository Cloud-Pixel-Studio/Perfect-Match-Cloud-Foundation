[project]
name = "perfect-match-cloud-api"
version = "0.2.0"
description = "Perfect Match Cloud identity and multi-tenancy foundation"
license = "LicenseRef-Proprietary"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.40,<2",
  "cryptography==50.0.1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "joserfc>=1.7,<2",
  "pg8000>=1.31,<2",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.40,<2",
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pip-licenses>=5,<6",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmc_api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pmc_api"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["tenant_isolation: tests requiring disposable PostgreSQL with forced RLS"]
